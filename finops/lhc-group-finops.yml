specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: LHC Group
providerId: lhc-group
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Home Health
  - Hospice
  - Healthcare
description: 'FOCUS-aligned FinOps scaffold for LHC Group: partner-only healthcare API access with no
  public per-call pricing. Consumer-side spend tracks against the partner / BAA contract rather than
  metered LHC Group invoices.'
notes: Pricing is contract-driven. Meters describe the consumer-side telemetry shape; reconcile against
  the executed partner / BAA agreement.
sources:
  - https://www.lhcgroup.com
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: LHC Group, Inc.
serviceCategory: Healthcare / API
billingModel:
  pricingCategory: Custom Contract
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: LHC Group API
  ServiceCategory: Healthcare / API
  ProviderName: LHC Group
  PublisherName: LHC Group, Inc.
  InvoiceIssuerName: LHC Group, Inc.
  BillingCurrency: USD
meters:
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - endpoint
      - environment
      - partner
  - name: partner_fees
    unit: month
    aggregation: sum
    dimensions:
      - contract
principles:
  - name: Visibility
    description: Track outbound API call volume and any referral / interop event volume in your own gateway
      / observability stack; LHC Group does not expose a public usage API.
  - name: Allocation
    description: Tag calls by service line (home health, hospice, referrals) and by consuming application
      so partner-contract spend can be charged back.
  - name: Optimization
    description: Batch referral and authorization checks; cache static facility / clinician reference
      data to stay within contracted volumes.
  - name: Accountability
    description: Assign a contract owner per LHC Group / Optum partner agreement and review monthly against
      contracted volume and PHI handling controls.
maintainers:
